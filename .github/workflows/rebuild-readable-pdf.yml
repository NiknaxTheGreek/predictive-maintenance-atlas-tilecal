name: Diagnose TileCal PDF figures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-readable-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install --quiet pymupdf pillow

      - name: Inspect embedded figures
        shell: bash
        run: |
          set -euo pipefail
          PDF=Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          echo '=== PDF INFO ==='
          pdfinfo "$PDF" | sed -n '1,20p'
          echo '=== EMBEDDED RASTER IMAGES ==='
          pdfimages -list "$PDF"
          echo '=== IMAGE PLACEMENTS / EFFECTIVE DPI ==='
          python - <<'PY'
          import fitz
          from collections import defaultdict
          doc=fitz.open('Predictive_Maintenance_ATLAS_TileCal_Report.pdf')
          for pno,page in enumerate(doc,1):
              seen=set()
              for info in page.get_images(full=True):
                  xref=info[0]
                  if xref in seen: continue
                  seen.add(xref)
                  pix=fitz.Pixmap(doc,xref)
                  for rect in page.get_image_rects(xref):
                      dx = pix.width / (rect.width/72) if rect.width else 0
                      dy = pix.height / (rect.height/72) if rect.height else 0
                      print(f'page={pno:02d} xref={xref:04d} pixels={pix.width}x{pix.height} rect={rect.width:.1f}x{rect.height:.1f}pt effective_dpi={dx:.1f}x{dy:.1f}')
          PY

      - name: Render pages for visual QA
        run: |
          mkdir -p rendered
          pdftoppm -png -r 180 Predictive_Maintenance_ATLAS_TileCal_Report.pdf rendered/page >/dev/null 2>&1

      - name: Upload rendered QA pages
        uses: actions/upload-artifact@v4
        with:
          name: tilecal-pdf-rendered-pages
          path: rendered/*.png
          compression-level: 6

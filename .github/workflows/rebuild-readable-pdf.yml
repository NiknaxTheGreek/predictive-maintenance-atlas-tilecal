name: Rebuild readable TileCal PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-readable-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and validate high-resolution report
        shell: bash
        run: |
          set -euo pipefail

          git checkout origin/pdf-transfer-final-5 -- .upload
          test -f .upload/finalx.b64.part00
          test -f .upload/finalx.b64.part04

          : > /tmp/tilecal-report.pdf.xz
          for part in .upload/finalx.b64.part*; do
            base64 --decode --ignore-garbage "$part" >> /tmp/tilecal-report.pdf.xz
          done

          xz --test /tmp/tilecal-report.pdf.xz
          xz --decompress --stdout /tmp/tilecal-report.pdf.xz > /tmp/Predictive_Maintenance_ATLAS_TileCal_Report.pdf

          head -c 5 /tmp/Predictive_Maintenance_ATLAS_TileCal_Report.pdf | grep -q '%PDF-'
          echo 'c571ab58279773f1b0ce805d410e2c2d49aef393d20fc23992da50b8d742ef68  /tmp/Predictive_Maintenance_ATLAS_TileCal_Report.pdf' | sha256sum -c -

          old_size=$(stat -c%s Predictive_Maintenance_ATLAS_TileCal_Report.pdf)
          new_size=$(stat -c%s /tmp/Predictive_Maintenance_ATLAS_TileCal_Report.pdf)
          echo "Current PDF: ${old_size} bytes"
          echo "Readable PDF: ${new_size} bytes"

          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo /tmp/Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          fi

          mv /tmp/Predictive_Maintenance_ATLAS_TileCal_Report.pdf Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          rm -rf .upload .upload-readable
          rm -f .github/workflows/rebuild-readable-pdf.yml

      - name: Commit readable PDF replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace TileCal report with readable high-resolution figures'
          git push origin main

name: Fix report figure layout

on:
  push:
    branches: [main]
    paths:
      - '.layout-fix-trigger'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: pip install --quiet pymupdf pillow matplotlib numpy
      - name: Rebuild compact high-resolution report
        shell: bash
        run: |
          python - <<'PY'
          import fitz, io, os, math
          import numpy as np
          import matplotlib.pyplot as plt
          from PIL import Image, ImageDraw, ImageFont

          src_path = 'Predictive_Maintenance_ATLAS_TileCal_Report.pdf'
          src = fitz.open(src_path)
          if src.page_count < 10:
              raise RuntimeError(f'Expected 10-page source report, found {src.page_count}')
          W, H = src[0].rect.width, src[0].rect.height

          def extract_single_image(page_no, out_name):
              imgs = src[page_no].get_images(full=True)
              if not imgs:
                  raise RuntimeError(f'No image found on page {page_no+1}')
              xref = imgs[0][0]
              data = src.extract_image(xref)['image']
              with open(out_name, 'wb') as f:
                  f.write(data)
              return out_name

          flow = extract_single_image(3, '/tmp/flow.png')
          fig4 = extract_single_image(5, '/tmp/fig4.png')
          fig5_src = extract_single_image(6, '/tmp/fig5_source.png')

          im = Image.open(fig5_src).convert('RGB')
          scale = 2
          im2 = im.resize((im.width * scale, im.height * scale), Image.Resampling.LANCZOS)
          draw = ImageDraw.Draw(im2)
          left = int(im2.width * 0.49)
          band_h = int(im2.height * 0.06)
          draw.rectangle((left, 0, im2.width, band_h), fill='white')
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font = ImageFont.truetype(font_path, max(28, int(im2.height * 0.027)))
          title = '(b) EBC.M10 - ALERT | selected bin: 25 ms'
          tb = draw.textbbox((0, 0), title, font=font)
          tw = tb[2] - tb[0]
          tx = left + (im2.width - left - tw) / 2
          ty = max(4, int(im2.height * 0.012))
          draw.text((tx, ty), title, fill='black', font=font)
          fig5 = '/tmp/fig5_clean.png'
          im2.save(fig5, optimize=True)

          labels = ['E1 ALERT','E2 EMR','E3 NO CONN.','E4 NO TOGGLE','E5 TRIPPED']
          cm = np.array([[.45,0,0,0,.55],[0,.29,0,0,.71],[0,0,.95,0,.05],[0,0,0,.29,.71],[0,0,0,0,1.]])
          raw_p=np.array([.58,0,.94,0,.09]); proc_p=np.array([.64,.67,.80,1.,.43])
          raw_r=np.array([.13,0,.98,0,.80]); proc_r=np.array([.45,.29,.95,.29,1.])
          raw_f=np.array([.22,0,.96,0,.15]); proc_f=np.array([.53,.40,.87,.44,.60])
          fig = plt.figure(figsize=(12,9), dpi=220, constrained_layout=True)
          gs = fig.add_gridspec(2,2, width_ratios=[1.05,1], height_ratios=[1,1], wspace=.16, hspace=.24)
          ax=fig.add_subplot(gs[0,0]); hm=ax.imshow(cm,vmin=0,vmax=1,cmap='Greens')
          ax.set_title('(a) Processed classifier: row-normalized confusion matrix',fontsize=13,pad=10,weight='bold')
          ax.set_xticks(range(5),labels,rotation=32,ha='right',fontsize=9); ax.set_yticks(range(5),labels,fontsize=9)
          ax.set_xlabel('Predicted class',fontsize=11,labelpad=8); ax.set_ylabel('True class',fontsize=11)
          for i in range(5):
              for j in range(5):
                  v=cm[i,j]; ax.text(j,i,f'{v:.2f}',ha='center',va='center',fontsize=9,color='white' if v>.58 else 'black')
          cb=fig.colorbar(hm,ax=ax,fraction=.046,pad=.04); cb.ax.tick_params(labelsize=8)
          def grouped(ax,a,b,title,ylabel):
              x=np.arange(len(labels)); w=.36
              ax.bar(x-w/2,a,w,label='Raw'); ax.bar(x+w/2,b,w,label='Processed')
              ax.set_ylim(0,1.06); ax.set_title(title,fontsize=13,pad=10,weight='bold'); ax.set_ylabel(ylabel,fontsize=11)
              ax.set_xticks(x,labels,rotation=25,ha='right',fontsize=9); ax.tick_params(axis='y',labelsize=9)
              ax.grid(axis='y',alpha=.18); ax.legend(frameon=False,fontsize=9,loc='upper right')
          grouped(fig.add_subplot(gs[0,1]),raw_p,proc_p,'(b) Precision: raw vs processed','Precision')
          grouped(fig.add_subplot(gs[1,0]),raw_r,proc_r,'(c) Recall: raw vs processed','Recall')
          grouped(fig.add_subplot(gs[1,1]),raw_f,proc_f,'(d) Per-class F1: raw vs processed','F1-score')
          fig6='/tmp/fig6_clean.png'; fig.savefig(fig6,bbox_inches='tight',pad_inches=.10); plt.close(fig)

          out = fitz.open()
          for i in range(3):
              out.insert_pdf(src, from_page=i, to_page=i)

          def header_footer(page, num):
              page.insert_text((50,16),'Predictive Maintenance of the ATLAS Tile Calorimeter',fontname='tiro',fontsize=7.2)
              page.insert_text((516,16),'Nicholas Perikli',fontname='tiro',fontsize=7.2)
              page.draw_line((50,20),(545,20),color=(.25,.25,.25),width=.4)
              page.insert_text((294,825),str(num),fontname='tiro',fontsize=7.2)
          def clip(dst, pno, c, d):
              dst.show_pdf_page(fitz.Rect(*d),src,pno,clip=fitz.Rect(*c),keep_proportion=False)
          def caption(page,y0,y1,text,fs=8.15):
              page.insert_textbox(fitz.Rect(58,y0,537,y1),text,fontname='tiro',fontsize=fs,align=fitz.TEXT_ALIGN_CENTER)

          p=out.new_page(width=W,height=H); clip(p,3,(0,22,W,315),(0,22,W,315))
          ar=Image.open(flow).width/Image.open(flow).height; fw=400; fh=fw/ar; fx=(W-fw)/2; fy=326
          p.insert_image(fitz.Rect(fx,fy,fx+fw,fy+fh),filename=flow,keep_proportion=True)
          caption(p,592,628,'Figure 3: End-to-end TileCal alarm-analysis workflow, from DCS records and NLP extraction to module-level forecasting,\npartition-level classification and predictive-maintenance outputs.')
          clip(p,4,(45,40,550,135),(45,650,550,745)); header_footer(p,4)

          p=out.new_page(width=W,height=H); clip(p,4,(45,145,550,432),(45,40,550,327)); clip(p,5,(45,45,550,165),(45,340,550,460))
          im4=Image.open(fig4); ar4=im4.width/im4.height; fw4=390; fh4=fw4/ar4; fx4=(W-fw4)/2; fy4=475
          p.insert_image(fitz.Rect(fx4,fy4,fx4+fw4,fy4+fh4),filename=fig4,keep_proportion=True)
          caption(p,772,800,'Figure 4: Spatial alarm activity and high-activity forecasting targets derived from the source analysis [15].',8.2); header_footer(p,5)

          p=out.new_page(width=W,height=H); clip(p,5,(45,600,550,650),(45,38,550,88))
          im5=Image.open(fig5); ar5=im5.width/im5.height; fw5=490; fh5=fw5/ar5; fx5=(W-fw5)/2; fy5=96
          p.insert_image(fitz.Rect(fx5,fy5,fx5+fw5,fy5+fh5),filename=fig5,keep_proportion=True)
          caption(p,470,500,'Figure 5: Temporal behaviour of the four selected module-alarm series at their final modelling resolutions: 15 min (EBA), 25 ms (EBC),\n1 h (LBA) and 15 min (LBC).')
          clip(p,6,(45,368,550,582),(45,510,550,724)); header_footer(p,6)

          p=out.new_page(width=W,height=H); clip(p,7,(45,40,550,275),(45,38,550,273))
          im6=Image.open(fig6); ar6=im6.width/im6.height; fw6=490; fh6=fw6/ar6; fx6=(W-fw6)/2; fy6=286
          p.insert_image(fitz.Rect(fx6,fy6,fx6+fw6,fy6+fh6),filename=fig6,keep_proportion=True)
          caption(p,661,693,'Figure 6: Effect of chattering reduction on dominant alarm-type classification: processed confusion matrix and raw-versus-processed\nclass-level precision, recall and F1.')
          clip(p,8,(45,40,550,137),(45,700,550,797)); header_footer(p,7)

          p=out.new_page(width=W,height=H); clip(p,8,(45,138,550,186),(45,38,550,86)); clip(p,8,(45,203,550,558),(45,102,550,457)); clip(p,8,(45,572,550,792),(45,480,550,700)); header_footer(p,8)
          p=out.new_page(width=W,height=H); clip(p,9,(45,42,550,294),(45,38,550,290)); header_footer(p,9)

          tmp='/tmp/final-report.pdf'; out.save(tmp,garbage=4,deflate=True); out.close(); src.close()
          check=fitz.open(tmp)
          if check.page_count != 9:
              raise RuntimeError(f'Unexpected final page count: {check.page_count}')
          check.close()
          os.replace(tmp,src_path)
          PY
      - name: Commit corrected PDF
        shell: bash
        run: |
          rm -f .layout-fix-trigger .github/workflows/fix-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve figure layout and readability'
          git push

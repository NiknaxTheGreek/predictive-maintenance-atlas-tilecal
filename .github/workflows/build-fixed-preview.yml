name: Build fixed TileCal PDF preview

on:
  push:
    branches: [main]
    paths:
      - '.layout-v2-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source PDF
        uses: actions/upload-artifact@v4
        with:
          name: tilecal-source-pdf
          path: Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          retention-days: 3

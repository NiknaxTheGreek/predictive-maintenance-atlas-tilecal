name: Restore original TileCal figures at high resolution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-original-figures-hires.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-enhance-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils ghostscript
          python -m pip install --quiet pymupdf pillow numpy

      - name: Recover exact pre-redesign report
        shell: bash
        run: |
          set -euo pipefail
          git show dfba209a80170e874e91f8c9f454fef893791747:Predictive_Maintenance_ATLAS_TileCal_Report.pdf > /tmp/original.pdf
          test -s /tmp/original.pdf
          test "$(pdfinfo /tmp/original.pdf | awk '/^Pages:/ {print $2}')" = "10"

      - name: Enhance only the six original embedded figures
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/enhance_originals.py <<'PY'
          import io
          import numpy as np
          import pymupdf
          from PIL import Image, ImageFilter

          src='/tmp/original.pdf'
          out='/tmp/enhanced_pre.pdf'
          pages=[1,2,3,5,6,7]
          doc=pymupdf.open(src)
          report=[]

          for pidx in pages:
              page=doc[pidx]
              imgs=page.get_images(full=True)
              if len(imgs) != 1:
                  raise RuntimeError(f'Page {pidx+1}: expected exactly one original figure, found {len(imgs)}')
              xref=imgs[0][0]
              raw=doc.extract_image(xref)['image']
              original=Image.open(io.BytesIO(raw)).convert('RGB')
              ow,oh=original.size

              # Pure resolution enhancement only: no crop, no redraw, no changed labels/data/layout.
              scale=6
              enhanced=original.resize((ow*scale, oh*scale), Image.Resampling.LANCZOS)
              enhanced=enhanced.filter(ImageFilter.UnsharpMask(radius=1.4, percent=115, threshold=3))

              # Verify the enhanced image remains visually the same when reduced to source size.
              back=enhanced.resize((ow,oh), Image.Resampling.LANCZOS)
              a=np.asarray(original,dtype=np.float32)
              b=np.asarray(back,dtype=np.float32)
              mae=float(np.mean(np.abs(a-b)))
              if mae > 8.0:
                  raise RuntimeError(f'Page {pidx+1}: enhancement changed source image too much (MAE={mae:.2f})')

              buf=io.BytesIO()
              enhanced.save(buf,'JPEG',quality=98,subsampling=0,optimize=True,progressive=False)
              page.replace_image(xref,stream=buf.getvalue())
              report.append((pidx+1,ow,oh,enhanced.width,enhanced.height,mae))

          doc.save(out,garbage=4,deflate=True,clean=True)
          for r in report:
              print(f'page={r[0]} original={r[1]}x{r[2]} enhanced={r[3]}x{r[4]} roundtrip_MAE={r[5]:.2f}')
          PY
          python /tmp/enhance_originals.py

      - name: Normalize PDF structure for GitHub browser preview
        shell: bash
        run: |
          set -euo pipefail
          gs -q -dNOPAUSE -dBATCH -dSAFER \
            -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.4 \
            -dPDFSETTINGS=/prepress \
            -dDownsampleColorImages=false \
            -dDownsampleGrayImages=false \
            -dDownsampleMonoImages=false \
            -dEmbedAllFonts=true \
            -dSubsetFonts=true \
            -sOutputFile=/tmp/final.pdf \
            /tmp/enhanced_pre.pdf

      - name: Validate final PDF with two renderers
        shell: bash
        run: |
          set -euo pipefail
          PDF=/tmp/final.pdf
          test -s "$PDF"
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" = "10"
          pdftotext "$PDF" /tmp/text.txt
          grep -q 'Predictive Maintenance' /tmp/text.txt

          echo '=== embedded images ==='
          pdfimages -list "$PDF"

          python - <<'PY'
          import pymupdf
          doc=pymupdf.open('/tmp/final.pdf')
          assert len(doc)==10
          for i,p in enumerate(doc):
              pix=p.get_pixmap(matrix=pymupdf.Matrix(2,2),alpha=False)
              pix.save(f'/tmp/mupdf-{i+1:02d}.png')
          print('PyMuPDF render: PASS')
          PY

          mkdir -p /tmp/poppler
          pdftoppm -png -r 160 "$PDF" /tmp/poppler/page >/dev/null 2>&1
          test "$(find /tmp/poppler -name 'page-*.png' | wc -l)" = "10"
          echo 'Poppler render: PASS'

          # Confirm the PDF is deliberately old/simple enough for browser PDF.js viewers.
          pdfinfo "$PDF" | grep -E 'PDF version|Pages|File size'

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilecal-original-figures-hires-qa
          path: |
            /tmp/final.pdf
            /tmp/poppler/page-*.png
            /tmp/mupdf-*.png

      - name: Publish corrected report to main
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/final.pdf Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          rm -f .github/workflows/restore-original-figures-hires.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore original TileCal figures with resolution enhancement only'
          git push origin main

name: Assemble technical report PDF

on:
  push:
    branches: [main]
    paths:
      - '.upload/ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify PDF
        shell: bash
        run: |
          cat .upload/final14.b64.part* > /tmp/report.b64
          base64 -d /tmp/report.b64 > Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          test -s Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          echo 'd06bb693300887a15c7a2fcfc8f1202f456f1dbaab35351b0b8f805ed8d1f1e6  Predictive_Maintenance_ATLAS_TileCal_Report.pdf' | sha256sum -c -
          rm -rf .upload
          rm -f .github/workflows/assemble-report.yml
      - name: Commit final report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add final technical report PDF'
          git push

name: Assemble technical report PDF

on:
  push:
    branches: [main]
    paths:
      - '.upload/ready'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify PDF
        shell: bash
        run: |
          cat .upload/finalx.b64.part* > /tmp/report.xz.b64
          base64 -d /tmp/report.xz.b64 > /tmp/report.pdf.xz
          xz -d -c /tmp/report.pdf.xz > Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          test -s Predictive_Maintenance_ATLAS_TileCal_Report.pdf
          echo '83d7066f4a6a9c2ec7e5eb8bd3c017652f75423d22e2c9db8e75f33e21b1f8ec  Predictive_Maintenance_ATLAS_TileCal_Report.pdf' | sha256sum -c -
          rm -rf .upload
          rm -f .github/workflows/assemble-report.yml
      - name: Commit final report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add final technical report PDF'
          git push
